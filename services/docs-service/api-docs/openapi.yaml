openapi: 3.0.3
info:
  title: AeroLink Airline Systems API
  description: |
    Cloud-native microservices API for AeroLink Airline Systems.
    Provides flight management, booking, baggage tracking, and notification services.
  version: 1.0.0
  contact:
    name: AeroLink Development Team

servers:
  - url: /api/v1
    description: AeroLink API (Cloud Load Balancer)
  - url: http://localhost:3001/api/v1
    description: Auth Service (Local)
  - url: http://localhost:3002/api/v1
    description: Flight Service (Local)
  - url: http://localhost:3003/api/v1
    description: Booking Service (Local)
  - url: http://localhost:3004/api/v1
    description: Baggage Service (Local)

tags:
  - name: Auth
    description: Authentication & Authorization
  - name: Flights
    description: Flight Management
  - name: Bookings
    description: Booking & Reservations
  - name: Baggage
    description: Baggage Tracking
  - name: Health
    description: Service Health Checks

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          
  /auth/login:
    post:
      tags: [Auth]
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
          
  /users/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized

  /flights:
    get:
      tags: [Flights]
      summary: Search available flights
      parameters:
        - in: query
          name: origin
          schema:
            type: string
        - in: query
          name: destination
          schema:
            type: string
      responses:
        '200':
          description: List of flights retrieved successfully
          
  /bookings:
    post:
      tags: [Bookings]
      summary: Create a new flight booking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flightId, seatId, paymentToken]
              properties:
                flightId:
                  type: string
                  example: FL-CMB-DXB-001
                seatId:
                  type: string
                  example: 1A
                paymentToken:
                  type: string
                  example: tok_visa
      responses:
        '201':
          description: Booking created successfully

  /baggage/{baggageId}:
    get:
      tags: [Baggage]
      summary: Get baggage tracking status
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: baggageId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Baggage status retrieved successfully

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        service:
          type: string
          example: auth-service
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          example: 123.45
        version:
          type: string
          example: 1.0.0

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Internal Server Error

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
        user:
          type: object
          properties:
            userId:
              type: string
            email:
              type: string
            role:
              type: string

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          type: object
          properties:
            userId:
              type: string
            email:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            role:
              type: string
