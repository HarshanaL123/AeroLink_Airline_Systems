openapi: 3.0.3
info:
  title: AeroLink Airline Systems API
  description: |
    Cloud-native microservices API for AeroLink Airline Systems.
    Provides flight management, booking, baggage tracking, and notification services.
  version: 1.0.0
  contact:
    name: AeroLink Development Team

servers:
  - url: http://localhost:3001/api/v1
    description: Auth Service (Local)
  - url: http://localhost:3002/api/v1
    description: Flight Service (Local)
  - url: http://localhost:3003/api/v1
    description: Booking Service (Local)
  - url: http://localhost:3004/api/v1
    description: Baggage Service (Local)

tags:
  - name: Auth
    description: Authentication & Authorization
  - name: Flights
    description: Flight Management
  - name: Bookings
    description: Booking & Reservations
  - name: Baggage
    description: Baggage Tracking
  - name: Health
    description: Service Health Checks

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

# API paths will be added as each service is implemented
# Day 2: Auth endpoints
# Day 3: Flight endpoints
# Day 4: Booking endpoints
# Day 5: Baggage endpoints

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        service:
          type: string
          example: auth-service
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          example: 123.45
        version:
          type: string
          example: 1.0.0

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Internal Server Error
