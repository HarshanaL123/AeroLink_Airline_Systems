# =============================================================================
# AeroLink Airline Systems — Docker Compose (Local Development)
# =============================================================================
# Starts all 4 microservices + DynamoDB Local with one command:
#   docker-compose up --build
#
# Stops everything:
#   docker-compose down
# =============================================================================

services:
  # =========================================
  # Database: DynamoDB Local
  # =========================================
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: aerolink-dynamodb
    user: root
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - dynamodb-data:/data
    networks:
      - aerolink-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/shell/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # =========================================
  # DynamoDB Table Creator (runs once, then exits)
  # =========================================
  dynamodb-setup:
    image: amazon/aws-cli:latest
    container_name: aerolink-dynamodb-setup
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Create Users table with EmailIndex GSI
        aws dynamodb create-table \
          --table-name Users \
          --attribute-definitions AttributeName=userId,AttributeType=S AttributeName=email,AttributeType=S \
          --key-schema AttributeName=userId,KeyType=HASH \
          --global-secondary-indexes '[{"IndexName": "EmailIndex","KeySchema":[{"AttributeName":"email","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000 2>/dev/null || true

        # Create Flights table
        aws dynamodb create-table \
          --table-name Flights \
          --attribute-definitions AttributeName=flightId,AttributeType=S AttributeName=departureAirport,AttributeType=S AttributeName=routeDate,AttributeType=S \
          --key-schema AttributeName=flightId,KeyType=HASH \
          --global-secondary-indexes '[{"IndexName": "RouteDateIndex","KeySchema":[{"AttributeName":"departureAirport","KeyType":"HASH"},{"AttributeName":"routeDate","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000 2>/dev/null || true

        # Create Seats table
        aws dynamodb create-table \
          --table-name Seats \
          --attribute-definitions AttributeName=flightId,AttributeType=S AttributeName=seatId,AttributeType=S \
          --key-schema AttributeName=flightId,KeyType=HASH AttributeName=seatId,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000 2>/dev/null || true

        # Create Bookings table
        aws dynamodb create-table \
          --table-name Bookings \
          --attribute-definitions AttributeName=bookingId,AttributeType=S \
          --key-schema AttributeName=bookingId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000 2>/dev/null || true

        # Create Payments table
        aws dynamodb create-table \
          --table-name Payments \
          --attribute-definitions AttributeName=paymentId,AttributeType=S \
          --key-schema AttributeName=paymentId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000 2>/dev/null || true

        # Create Baggage table
        aws dynamodb create-table \
          --table-name Baggage \
          --attribute-definitions AttributeName=baggageId,AttributeType=S \
          --key-schema AttributeName=baggageId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000 2>/dev/null || true

        # Create Notifications table
        aws dynamodb create-table \
          --table-name Notifications \
          --attribute-definitions AttributeName=notificationId,AttributeType=S \
          --key-schema AttributeName=notificationId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000 2>/dev/null || true

        echo "✅ All DynamoDB tables created successfully!"
        aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000
    networks:
      - aerolink-network

  # =========================================
  # Auth Service (Port 3001)
  # =========================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: aerolink-auth
    ports:
      - "4001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - USERS_TABLE=Users
      - JWT_SECRET=aerolink-dev-jwt-secret-2026
      - JWT_EXPIRES_IN=24h
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    networks:
      - aerolink-network
    restart: unless-stopped

  # =========================================
  # Flight Service (Port 3002)
  # =========================================
  flight-service:
    build:
      context: ./services/flight-service
      dockerfile: Dockerfile
    container_name: aerolink-flight
    ports:
      - "4002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - FLIGHTS_TABLE=Flights
      - SEATS_TABLE=Seats
      - JWT_SECRET=aerolink-dev-jwt-secret-2026
      - EVENT_BUS_NAME=aerolink-event-bus
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    networks:
      - aerolink-network
    restart: unless-stopped

  # =========================================
  # Booking Service (Port 3003)
  # =========================================
  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: aerolink-booking
    ports:
      - "4003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - BOOKINGS_TABLE=Bookings
      - PAYMENTS_TABLE=Payments
      - JWT_SECRET=aerolink-dev-jwt-secret-2026
      - EVENT_BUS_NAME=aerolink-event-bus
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    networks:
      - aerolink-network
    restart: unless-stopped

  # =========================================
  # Baggage Service (Port 3004)
  # =========================================
  baggage-service:
    build:
      context: ./services/baggage-service
      dockerfile: Dockerfile
    container_name: aerolink-baggage
    ports:
      - "4004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - BAGGAGE_TABLE=Baggage
      - JWT_SECRET=aerolink-dev-jwt-secret-2026
      - EVENT_BUS_NAME=aerolink-event-bus
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    networks:
      - aerolink-network
    restart: unless-stopped

# =========================================
# Shared Network & Volumes
# =========================================
networks:
  aerolink-network:
    driver: bridge
    name: aerolink-network

volumes:
  dynamodb-data:
    driver: local
