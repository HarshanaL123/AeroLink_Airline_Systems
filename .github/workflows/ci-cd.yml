# AeroLink Airline Systems — CI/CD Pipeline
# Enhancement #1: Automated Build → Test → Deploy

name: AeroLink CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'

jobs:
  # ============================================
  # Job 1: Lint & Unit Tests
  # ============================================
  test:
    name: Test Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - flight-service
          - booking-service
          - baggage-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test

  # ============================================
  # Job 2: Build Docker Images (CI Demonstration)
  # ============================================
  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - auth-service
          - flight-service
          - booking-service
          - baggage-service
          - docs-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd services/${{ matrix.service }}
          echo "Building Docker Image for ${{ matrix.service }}..."
          docker build -t aerolink-${{ matrix.service }}:$IMAGE_TAG .
          echo "✅ Successfully built aerolink-${{ matrix.service }}:$IMAGE_TAG"

  # ============================================
  # Job 3: GitOps Deployment Trigger (ArgoCD)
  # ============================================
  # This section dynamically updates the k8s/ deployment manifests 
  # with the new IMAGE_TAG, committing it back to the repo so ArgoCD can sync.
